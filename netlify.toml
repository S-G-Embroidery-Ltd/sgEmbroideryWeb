# Vite output must be published (build/), not the source tree — otherwise /src/main.tsx
# is served as a static file → application/octet-stream → module script errors.
#
# Leave Netlify "Base directory" *empty* so this runs from the repo root.
[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/build"

# Environment variables for production
[build.environment]
  VITE_API_URL = "https://sgembroidery-backend.onrender.com/api"
